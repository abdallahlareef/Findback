spring.application.name=findback-backend
server.port=8080

# Connect to the findback-postgres Docker container on port 5432
spring.datasource.url=jdbc:postgresql://localhost:5432/findback_db
spring.datasource.username=findback_user
spring.datasource.password=findback_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Automatically create/update Member 3 database tables from Java @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
